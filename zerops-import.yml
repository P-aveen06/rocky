# One-time infrastructure definition. Import with:
#   zcli project project-import zerops-import.yml
#
# The project owns both the application runtime and its PostgreSQL database.
# Repeat application deploys are driven by zerops.yml through the GitHub Actions
# workflow, not by re-importing this file.
project:
  name: rocky
  tags:
    - hackathon

services:
  - hostname: db
    type: postgresql:single@17
    # The application is an OLTP workload. Hobby keeps the hackathon deployment
    # inexpensive while retaining managed backups and vertical autoscaling.
    profile: oltp-hobby

  - hostname: app
    type: python@3.12
    enableSubdomainAccess: true

    envVariables:
      # Publishable by design -- it ships inside the JavaScript bundle -- and the
      # Vite build needs it, so it lives here rather than in envSecrets, which is
      # not exposed to the build container.
      CLERK_PUBLISHABLE_KEY: pk_test_bm9ibGUtbGFjZXdpbmctNy5jbGVyay5hY2NvdW50cy5kZXYk

    # PLACEHOLDERS. Replace these in the Zerops GUI under Service -> Environment
    # variables, or edit them before importing. Never commit real values.
    envSecrets:
      # Copy from .env.
      CLERK_SECRET_KEY: sk_test_REPLACE_ME
      # Optional: the PEM public key from Clerk -> API keys. With it set, session
      # verification never makes a network call for Clerk's JWKS.
      CLERK_JWT_KEY: ""
      AZURE_OPENAI_ENDPOINT: https://REPLACE.services.ai.azure.com
      AZURE_OPENAI_API_KEY: REPLACE_ME
      AZURE_OPENAI_TEXT_DEPLOYMENT: gpt-5.6-luna
      AZURE_OPENAI_REALTIME_DEPLOYMENT: gpt-realtime-2.1
      AZURE_OPENAI_REALTIME_TRANSCRIPTION_MODEL: gpt-realtime-whisper
      AZURE_OPENAI_FINAL_TRANSCRIPTION_DEPLOYMENT: gpt-4o-transcribe
